<style>
  /* Layout: navy slim header; off-white hero (copy | cover | form); white "inside" band; navy closing CTA; quiet footer. */
  :root {
    --navy: #0B1432;
    --navy-2: #16214A;
    --peach: #F1996A;
    --peach-hover: #EC8656;
    --peach-ink: #A8481C;
    --paper: #FAF6F1;
    --grey: #F1F2F4;
    --white: #FFFFFF;
    --slate: #4B5570;
    --line: #E3DCD3;
    --error: #B42318;
    --error-bg: #FDF1EF;
    --font-display: 'Cal Sans', 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
    --font-body: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
  body {
    background: var(--paper);
    color: var(--navy);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  /* full-bleed bands cancel the body gutter, and re-apply it inside .wrap */
  .band { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { width: 100%; max-width: 1200px; margin-inline: auto; }
  h1, h2, h3, .font-display { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.01em; text-wrap: balance; }
  .btn:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible, label:focus-within {
    outline: 3px solid var(--navy); outline-offset: 3px;
  }
  .on-navy a:focus-visible, .on-navy button:focus-visible { outline-color: var(--peach); }
  .field:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(241,153,106,.35); }
  .hero-grid { display: grid; gap: 28px; grid-template-columns: minmax(0,1fr); }
  @media (min-width: 1024px) {
    .hero-grid { grid-template-columns: minmax(0,52fr) minmax(0,48fr); column-gap: 64px; align-items: center; }
  }
  .about-bg { position: absolute; top: 0; left: 0; right: 0; height: 340px; -webkit-mask-image: linear-gradient(to bottom, #000 50%, transparent); mask-image: linear-gradient(to bottom, #000 50%, transparent); }
  @media (min-width: 1024px) {
    .about-bg { top: 0; bottom: 0; left: auto; right: 0; width: 66%; height: auto; -webkit-mask-image: linear-gradient(to right, transparent, #000 40%); mask-image: linear-gradient(to right, transparent, #000 40%); }
  }
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .scroll-target { scroll-margin-top: 88px; }
</style>

/* ------------------------------------------------------------------
   Validation + lead payload helpers
------------------------------------------------------------------- */
const INTENT = {
  yes: { value: 'yes', label: "Yes, I'm looking to buy an investment property", tag: 'investor_buying' },
  exploring: { value: 'exploring', label: "I'm exploring property investment options", tag: 'investor_exploring' },
  home: { value: 'home', label: "No, I'm looking for a home to live in", tag: 'owner_occupier_not_investor' },
};

const isValidEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());
// Accepts 04xx xxx xxx, +61 4xx xxx xxx, 61 4xx xxx xxx, with spaces, dashes, brackets.
const isValidAuMobile = (v) => {
  const s = v.replace(/[\s\-().]/g, '');
  return /^(?:\+?61|0)4\d{8}$/.test(s);
};

function validate(v) {
  const e = {};
  if (!v.firstName.trim()) e.firstName = 'Enter your first name.';
  if (!v.lastName.trim()) e.lastName = 'Enter your last name.';
  if (!v.email.trim()) e.email = 'Enter your email address.';
  else if (!isValidEmail(v.email)) e.email = 'Enter a valid email address, like name@example.com.';
  if (!v.mobile.trim()) e.mobile = 'Enter your mobile number.';
  else if (!isValidAuMobile(v.mobile)) e.mobile = 'Enter an Australian mobile number, like 0412 345 678 or +61 412 345 678.';
  if (!v.intent) e.intent = 'Choose the option that best describes you.';
  return e;
}

const newSubmissionId = () => {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (_) {}
  return 'sub_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
};

function readUtm() {
  const keys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
  const out = {};
  let params = null;
  try { params = new URLSearchParams(window.location.search); } catch (_) {}
  keys.forEach((k) => { out[k] = (params && params.get(k)) || null; });
  return out;
}

function buildLeadPayload(v) {
  const intent = INTENT[v.intent];
  return {
    submission_id: newSubmissionId(),
    lead_source: CONFIG.leadSource,
    ...readUtm(),
    first_name: v.firstName.trim(),
    last_name: v.lastName.trim(),
    email: v.email.trim(),
    mobile: v.mobile.trim(),
    qualifying_question: 'Are you considering buying a property for investment purposes?',
    qualifying_answer: intent.label,
    lead_tag: intent.tag,
    // Contact details are for the requested factsheet only. No marketing consent is captured on this form.
    // If an approved, compliant consent mechanism is added later, record it here with its own timestamp.
    marketing_consent: false,
    marketing_consent_timestamp: null,
    submitted_at: new Date().toISOString(),
  };
}

------------------------------------------------------------------- */
const FORM_ID = 'lead-form';
const FIRST_FIELD_ID = 'firstName';

function scrollToForm() {
  const el = document.getElementById(FORM_ID);
  if (!el) return;
  let reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) {}
  el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  const first = document.getElementById(FIRST_FIELD_ID) || el;
  setTimeout(() => { try { first.focus({ preventScroll: true }); } catch (_) { first.focus(); } }, reduce ? 0 : 450);
}

function CTAButton({ children, onClick, className = '', type = 'button', disabled = false, full = false, ...rest }) {

    <button
      type={type}

const inputCls = (err) =>
  'field min-h-[52px] w-full rounded-[10px] border bg-white px-4 py-3 text-base text-navy placeholder:text-slate/60 ' + (err ? 'border-danger bg-danger-bg' : 'border-[#C9CEDB]');

const EMPTY = { firstName: '', lastName: '', email: '', mobile: '', intent: '' };

function LeadForm() {
  const [v, setV] = useState(EMPTY);
  const [errors, setErrors] = useState({});
  const [touched, setTouched] = useState({});
  const [status, setStatus] = useState('idle'); // idle | sending | demo-success
  const [payloadPreview, setPayloadPreview] = useState(null);
  const successRef = useRef(null);

  const set = (k, val) => {
    const next = { ...v, [k]: val };
    setV(next);
    if (touched[k] || errors[k]) {
      const all = validate(next);
      setErrors((prev) => ({ ...prev, [k]: all[k] }));
    }
  };
  const blur = (k) => { setTouched((t) => ({ ...t, [k]: true })); setErrors((prev) => ({ ...prev, [k]: validate(v)[k] })); };
  const isHome = v.intent === 'home';

  const onSubmit = async (ev) => {
    ev.preventDefault();
    if (isHome) return;
    const all = validate(v);
    setErrors(all);
    setTouched({ firstName: true, lastName: true, email: true, mobile: true, intent: true });
    const order = ['firstName', 'lastName', 'email', 'mobile', 'intent'];
    const bad = order.find((k) => all[k]);
    if (bad) {
      const target = bad === 'intent' ? document.getElementById('intent-yes') : document.getElementById(bad);
      if (target) target.focus();
      return;
    }
    setStatus('sending');
    const payload = buildLeadPayload(v);
    try { await submitLead(payload); } catch (_) {}
    // Preview: show the shape of the payload with contact details masked; nothing is stored or transmitted.
    setPayloadPreview({ ...payload, first_name: '•••', last_name: '•••', email: '•••', mobile: '•••' });
    setStatus('demo-success');
    setTimeout(() => successRef.current && successRef.current.focus(), 30);
  };

  const reset = () => { setV(EMPTY); setErrors({}); setTouched({}); setStatus('idle'); setPayloadPreview(null); setTimeout(scrollToForm, 0); };

  const describe = (id, k) => (errors[k] ? id + '-err' : undefined);

  return (
    <section id={FORM_ID} aria-labelledby="form-title" className="scroll-target rounded-[22px] border border-line bg-white p-5 shadow-[0_28px_70px_-24px_rgba(0,0,0,0.55)] sm:p-8">
      {status === 'demo-success' ? (
        <div ref={successRef} tabIndex={-1} role="status" className="outline-none">
          <p className="inline-block rounded-[6px] bg-navy px-2.5 py-1 text-[11px] font-bold uppercase tracking-[0.12em] text-peach">Preview only</p>
          <h2 id="form-title" className="mt-4 text-2xl leading-tight text-navy">Preview only — your form is ready to connect. No SMS or email has been sent.</h2>
          <p className="mt-3 text-[15px] leading-relaxed text-slate">Nothing you entered was transmitted or stored. This is how the submission would be packaged once a real endpoint is connected (contact details masked here):</p>
          <details className="mt-4 rounded-[10px] border border-line bg-paper p-3 text-xs">
            <summary className="cursor-pointer font-semibold text-navy">View demo lead payload</summary>
            <pre className="mt-2 overflow-x-auto whitespace-pre-wrap break-words text-[12px] leading-relaxed text-navy">{JSON.stringify(payloadPreview, null, 2)}</pre>
          </details>
          <button type="button" onClick={reset} className="mt-5 min-h-[48px] rounded-[10px] border border-navy px-5 text-sm font-semibold uppercase tracking-[0.06em] text-navy hover:bg-paper">Start again</button>
        </div>
      ) : (
        <form onSubmit={onSubmit} noValidate aria-labelledby="form-title" className="flex flex-col gap-5">
          <div>
            <h2 id="form-title" className="text-[26px] leading-tight text-navy sm:text-[28px]">Get Your Free Investor Factsheet</h2>
            <p className="mt-2 text-[15px] leading-relaxed text-slate">Enter your details to receive InvestorMate's free guide to the negative gearing changes for residential investment properties.</p>
          </div>

          <div className="grid gap-4 sm:grid-cols-2">
            <Field id="firstName" label="First name" error={errors.firstName}>
              <input id="firstName" name="firstName" type="text" autoComplete="given-name" required value={v.firstName} onChange={(e) => set('firstName', e.target.value)} onBlur={() => blur('firstName')} aria-invalid={!!errors.firstName} aria-describedby={describe('firstName', 'firstName')} className={inputCls(errors.firstName)} />
            </Field>
            <Field id="lastName" label="Last name" error={errors.lastName}>
              <input id="lastName" name="lastName" type="text" autoComplete="family-name" required value={v.lastName} onChange={(e) => set('lastName', e.target.value)} onBlur={() => blur('lastName')} aria-invalid={!!errors.lastName} aria-describedby={describe('lastName', 'lastName')} className={inputCls(errors.lastName)} />
            </Field>
          </div>
          <Field id="email" label="Email address" error={errors.email}>
            <input id="email" name="email" type="email" inputMode="email" autoComplete="email" required value={v.email} onChange={(e) => set('email', e.target.value)} onBlur={() => blur('email')} aria-invalid={!!errors.email} aria-describedby={describe('email', 'email')} className={inputCls(errors.email)} />
          </Field>
          <Field id="mobile" label="Mobile number" error={errors.mobile}>
            <input id="mobile" name="mobile" type="tel" inputMode="tel" autoComplete="tel" required value={v.mobile} onChange={(e) => set('mobile', e.target.value)} onBlur={() => blur('mobile')} aria-invalid={!!errors.mobile} aria-describedby={describe('mobile', 'mobile')} className={inputCls(errors.mobile)} />
          </Field>

          <fieldset aria-describedby={errors.intent ? 'intent-err' : undefined} className="m-0 min-w-0 border-0 p-0">
            <legend className="mb-2 text-sm font-semibold leading-snug text-navy">Are you considering buying a property for investment purposes?</legend>
            <div className="flex flex-col gap-2">
              {Object.values(INTENT).map((o, i) => (
                <label key={o.value} className={'flex min-h-[52px] cursor-pointer items-center gap-3 rounded-[10px] border px-4 py-2.5 text-[15px] leading-snug text-navy ' + (v.intent === o.value ? 'border-navy bg-paper' : errors.intent ? 'border-danger' : 'border-[#C9CEDB]')}>
                  <input id={'intent-' + o.value} type="radio" name="intent" value={o.value} checked={v.intent === o.value} onChange={() => { set('intent', o.value); setErrors((p) => ({ ...p, intent: undefined })); }} required={i === 0} className="h-5 w-5 shrink-0 accent-[#0B1432]" />
                  <span>{o.label}</span>
                </label>
              ))}
            </div>
            {errors.intent && <p id="intent-err" className="mt-1.5 text-sm font-medium text-danger">{errors.intent}</p>}
          </fieldset>

          {isHome && (
            <div role="status" className="rounded-[10px] border-l-4 border-navy bg-paper p-4 text-[15px] leading-relaxed text-navy">
              <p className="font-semibold">Thanks for your interest.</p>
              <p className="mt-1 text-slate">This particular guide is designed for property investors considering an established residential property purchase, so it may not be relevant if you're looking for a home to live in. Your details have not been submitted or recorded as an investor enquiry.</p>
            </div>
          )}

          <div>
            <CTAButton type="submit" full disabled={isHome || status === 'sending'}>
              SEND ME THE FREE FACTSHEET →
            </CTAButton>
            <p className="mt-3 text-[13px] leading-snug text-slate">
              InvestorMate will use your details to send your requested factsheet. Read our <PlaceholderLink label="Privacy Policy" url={CONFIG.privacyUrl} className="text-navy" />.
            </p>
          </div>
        </form>
      )}
    </section>
  );
}

function Reviews() {
  const real = CONFIG.reviews.length > 0;
  const items = real ? CONFIG.reviews : [1, 2, 3, 4, 5].map((i) => ({ placeholder: true, i }));
  const track = useRef(null);
  const [edge, setEdge] = useState({ start: true, end: false });
  const update = () => {
    const el = track.current;
    if (!el) return;
    setEdge({ start: el.scrollLeft <= 4, end: el.scrollLeft + el.clientWidth >= el.scrollWidth - 4 });
  };
  useEffect(() => {
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);
  const go = (dir) => {
    const el = track.current;
    if (!el) return;
    const card = el.querySelector('li');
    const step = (card ? card.getBoundingClientRect().width : el.clientWidth) + 20;
    let reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) {}
    el.scrollBy({ left: dir * step, behavior: reduce ? 'auto' : 'smooth' });
  };
  const arrow = 'absolute top-1/2 z-10 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full border border-line bg-white text-navy shadow-[0_8px_20px_-8px_rgba(11,20,50,0.45)] transition-opacity disabled:pointer-events-none disabled:opacity-0';
